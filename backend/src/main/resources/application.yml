server:
  port: 8080
  error:
    include-message: never

spring:
  application:
    name: cloudstorage
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cloudstorage}
    username: ${SPRING_DATASOURCE_USERNAME:cloudstorage}
    password: ${SPRING_DATASOURCE_PASSWORD:cloudstorage_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE_BYTES:104857600B}
      max-request-size: ${MAX_REQUEST_SIZE_BYTES:524288000B}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  upload:
    max-size-bytes: ${MAX_UPLOAD_SIZE_BYTES:104857600}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:cloud-storage-files}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
